# Automated dependency updates.
#
# SOC 2 (CC7.1) asks for a *process* that finds and remediates vulnerable components, not just a
# scanner that reports them.
#
# Two ecosystems: the workflow's actions, and npm. Note that the SDK's *runtime* dependency
# policy is ZERO dependencies (ADR-0014) — everything npm resolves here is devDependencies
# (build, lint, test). Founding §8.1 wants SDKs dependency-light: a client SDK embedded in
# someone else's page is the worst place in the system to take on supply-chain surface, so the
# right response to most "add a library" updates here is still "why do we have this library".

version: 2
updates:
  # The workflow itself is a dependency. A compromised or abandoned action runs with our token —
  # and in a repository that will eventually publish a distributable artifact.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      npm:
        patterns: ["*"]
